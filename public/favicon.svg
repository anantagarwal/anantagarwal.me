<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <rect width="31" height="31" x="0.5" y="0.5" rx="7" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Subtle glow -->
  <circle cx="16" cy="16" r="10" fill="#38bdf8" opacity="0.08"/>

  <!-- Architectural 'A' Monogram -->
  <!-- Outer Chevron Frame -->
  <path d="M 8.5 24 L 16 7.5 L 23.5 24" 
        fill="none" 
        stroke="#f8fafc" 
        stroke-width="2.75" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- High-Tech Accent Crossbar -->
  <path d="M 11.5 18 H 20.5" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="2.75" 
        stroke-linecap="round"/>
</svg>
